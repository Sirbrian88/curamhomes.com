<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curam Homes — Coming Soon</title>
<link rel="icon" href="logo.webp">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #ffffff;
    color: #2c2a26;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .wrap { max-width: 640px; }
  .logo {
    width: 100%;
    max-width: 430px;
    height: auto;
    margin-bottom: 2rem;
  }
  .rule {
    width: 64px;
    height: 2px;
    background: #a89a7d;
    margin: 0 auto 1.5rem;
  }
  p {
    font-size: 1.05rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #6f675a;
  }
  .contact {
    margin-top: 1.75rem;
    font-size: 0.95rem;
    letter-spacing: 0.12em;
  }
  .contact a {
    color: #6f675a;
    text-decoration: none;
  }
  .contact a:hover {
    color: #2c2a26;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.webp" alt="Curam — Care Home Property Management">
    <div class="rule"></div>
    <p>Coming Soon</p>
    <p class="contact"><a href="mailto:info@curamhomes.com">info@curamhomes.com</a></p>
  </div>
</body>
</html>
